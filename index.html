<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Closed Test</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 30px 60px;
            font-size: 32px;
            font-weight: bold;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.8);
        }
    </style>
</head>
<body>

    <!-- ГЛАВНАЯ КНОПКА -->
    <button onclick="openFirstPage()">FUCK YOU!</button>

    <script>
        // Функция для первой страницы (PIERDOL SIĘ!)
        function openFirstPage() {
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Polski</title>
                    <style>
                        body {
                            background: #0f3460;
                            color: #ffd700;
                            font-family: Arial, sans-serif;
                            text-align: center;
                            margin: 0;
                            display: flex;
                            flex-direction: column;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                            font-size: 48px;
                            font-weight: bold;
                            gap: 30px;
                        }
                        .btn-second {
                            padding: 20px 40px;
                            font-size: 24px;
                            background: #e94560;
                            color: white;
                            border: none;
                            border-radius: 15px;
                            cursor: pointer;
                            transition: 0.3s;
                        }
                        .btn-second:hover {
                            transform: scale(1.1);
                            box-shadow: 0 0 30px rgba(233, 69, 96, 0.8);
                        }
                    </style>
                </head>
                <body>
                    🖕 PIERDOL SIĘ! 🖕
                    <button class="btn-second" onclick="window.opener.openSecondPage()">I dont knowing Polish</button>
                </body>
                </html>
            `);
            newWindow.document.close();
        }

        // Функция для второй страницы (HAHAHA...)
        function openSecondPage() {
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>

                    <style>
                        body {
                            background: #0f3460;
                            color: #ffd700;
                            font-family: Arial, sans-serif;

                            padding: 100px;
                            font-size: 48px;
                            font-weight: bold;
                            margin: 0;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            height: 100vh;
                        }
                    </style>
                </head>
                <body>
                    HAHAHAHAHAHAHAHAHA, GO TO LEARNING!
                </body>

            `);
            newWindow.document.close();

    </script>

</body>
</html>
