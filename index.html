<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🚨 ОСКОРБИТЕЛЬНЫЙ КВЕСТ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: relative;
            transition: 0.5s;
        }
        body.light {
            background: #f0f0f0;
        }
        body.light #game-container {
            background: #ffffff;
            border-color: #333;
            box-shadow: 0 0 60px rgba(0,0,0,0.2);
        }
        body.light #title {
            color: #333;
        }
        body.light #message {
            background: #f8f8f8;
            border-color: #333;
            color: #222;
        }
        body.light #stats {
            background: #e8e8e8;
            border-color: #333;
            color: #222;
        }
        body.light #stats span {
            color: #e94560;
        }
        body.cyber {
            background: #0a0a0a;
        }
        body.cyber #game-container {
            border-color: #00ffcc;
            box-shadow: 0 0 80px rgba(0, 255, 204, 0.3);
            background: #111122;
        }
        body.cyber #title {
            color: #00ffcc;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
        }
        body.cyber #message {
            border-color: #00ffcc;
            background: #0a0a1a;
            color: #00ffcc;
        }
        body.cyber #stats {
            border-color: #00ffcc;
            background: #0a0a1a;
            color: #00ffcc;
        }
        body.cyber .game-btn {
            border: 2px solid #00ffcc;
            background: transparent !important;
            color: #00ffcc !important;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        body.cyber .game-btn:hover {
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.6);
            background: rgba(0, 255, 204, 0.1) !important;
        }
        #game-container {
            background: #1a1a2e;
            padding: 40px 60px;
            border-radius: 40px;
            box-shadow: 0 0 60px rgba(233, 69, 96, 0.3);
            text-align: center;
            position: relative;
            max-width: 700px;
            border: 2px solid #e94560;
            transition: 0.5s;
        }
        #stats {
            display: flex;
            justify-content: space-between;
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 25px;
            padding: 10px 20px;
            background: #0f0f23;
            border-radius: 20px;
            border: 1px solid #e94560;
            flex-wrap: wrap;
            gap: 10px;
            transition: 0.3s;
        }
        #stats span {
            font-weight: bold;
            color: #ff6b81;
        }
        #title {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            transition: 0.3s;
        }
        #title .crab {
            font-size: 40px;
            display: inline-block;
            animation: walk 1s infinite alternate;
        }
        @keyframes walk {
            0% { transform: translateX(-5px) rotate(-5deg); }
            100% { transform: translateX(5px) rotate(5deg); }
        }
        #message {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 80px;
            padding: 20px;
            background: #0f0f23;
            border-radius: 20px;
            border: 2px dashed #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            transition: 0.3s;
        }
        #message .emoji-big {
            font-size: 50px;
        }
        #button-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }
        .game-btn {
            padding: 18px 35px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            min-width: 180px;
            flex: 1;
        }
        .game-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.6);
        }
        .btn-main {
            background: #e94560;
        }
        .btn-next {
            background: #1e90ff;
        }
        .btn-danger {
            background: #ff3333;
        }
        .btn-success {
            background: #2ecc71;
        }
        .btn-google {
            background: #4285F4;
        }
        .btn-yandex {
            background: #ff3333;
        }
        .btn-boss {
            background: #9b59b6;
            animation: pulse 1s infinite;
        }
        .btn-theme {
            background: #f39c12;
            font-size: 16px;
            padding: 10px 20px;
            min-width: auto;
            flex: 0.5;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px #9b59b6; }
            50% { box-shadow: 0 0 60px #9b59b6; }
            100% { box-shadow: 0 0 20px #9b59b6; }
        }
        #boss-input {
            padding: 15px 25px;
            font-size: 24px;
            border-radius: 20px;
            border: 2px solid #e94560;
            background: #0f0f23;
            color: white;
            text-align: center;
            width: 250px;
            outline: none;
            transition: 0.3s;
        }
        #boss-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        #lives {
            color: #ff4757;
            font-size: 28px;
            letter-spacing: 5px;
        }
        #achievement {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ecc71;
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.5);
            opacity: 0;
            transform: translateY(100px);
            transition: 0.5s;
            z-index: 999;
        }
        #achievement.show {
            opacity: 1;
            transform: translateY(0);
        }
        #crab-walk {
            position: fixed;
            bottom: 20px;
            left: -100px;
            font-size: 60px;
            animation: crabMove 15s linear infinite;
            z-index: 100;
        }
        @keyframes crabMove {
            0% { left: -100px; }
            100% { left: 110vw; }
        }
        .hidden {
            display: none !important;
        }
        #restart-btn {
            padding: 12px 30px;
            font-size: 18px;
            background: #ff6b81;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        #restart-btn:hover {
            transform: scale(1.05);
        }
        .boss-wrong {
            border-color: #ff3333 !important;
            box-shadow: 0 0 40px rgba(255, 51, 51, 0.8) !important;
        }
        .boss-correct {
            border-color: #2ecc71 !important;
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.8) !important;
        }
        #theme-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        .theme-btn {
            padding: 8px 16px;
            border: 2px solid white;
            border-radius: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 14px;
        }
        .theme-btn:hover {
            transform: scale(1.05);
        }
        .theme-btn.dark { background: #1a1a2e; border-color: #e94560; }
        .theme-btn.light { background: #f0f0f0; color: #222; border-color: #333; }
        .theme-btn.cyber { background: #00ffcc; color: #0a0a0a; border-color: #00ffcc; }
        .stat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            color: white;
            font-size: 24px;
            gap: 20px;
        }
        .stat-overlay.show {
            display: flex;
        }
        .stat-box {
            background: #1a1a2e;
            padding: 40px 60px;
            border-radius: 30px;
            border: 2px solid #e94560;
            max-width: 500px;
            text-align: center;
        }
        .stat-box h2 {
            color: #ffd700;
            margin-bottom: 20px;
        }
        .stat-box p {
            margin: 10px 0;
            font-size: 20px;
        }
        .stat-box .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .close-stats {
            padding: 15px 40px;
            font-size: 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
        }
        .close-stats:hover {
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            #game-container { padding: 20px; }
            #message { font-size: 24px; }
            .game-btn { font-size: 16px; min-width: 120px; padding: 12px 20px; }
            #title { font-size: 20px; }
            #boss-input { width: 180px; font-size: 18px; }
            #theme-selector { top: 10px; right: 10px; }
            .theme-btn { font-size: 12px; padding: 5px 10px; }
            .stat-box { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- ТЕМЫ -->
    <div id="theme-selector">
        <button class="theme-btn dark" onclick="setTheme('dark')">🌙 Тёмная</button>
        <button class="theme-btn light" onclick="setTheme('light')">☀️ Светлая</button>
        <button class="theme-btn cyber" onclick="setTheme('cyber')">💠 Киберпанк</button>
    </div>

    <!-- КРАБ-БЕГУН -->
    <div id="crab-walk">🦀</div>

    <!-- ДОСТИЖЕНИЕ -->
    <div id="achievement">🏆 ДОСТИЖЕНИЕ РАЗБЛОКИРОВАНО!</div>

    <!-- СТАТИСТИКА -->
    <div class="stat-overlay" id="stat-overlay">
        <div class="stat-box">
            <h2>📊 СТАТИСТИКА ИГРЫ</h2>
            <p>⏱️ Время: <span class="highlight" id="stat-time">0</span> сек.</p>
            <p>🖱️ Нажатий: <span class="highlight" id="stat-clicks">0</span></p>
            <p>🦀 Крабов собрано: <span class="highlight" id="stat-crabs">0</span></p>
            <p>❤️ Потеряно жизней: <span class="highlight" id="stat-lives">0</span></p>
            <p>🏆 Достижений: <span class="highlight" id="stat-achieve">0</span></p>
            <button class="close-stats" onclick="closeStats()">✅ Закрыть</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИГРОВОЙ КОНТЕЙНЕР -->
    <div id="game-container">
        <div id="stats">
            <div>🗺️ ЭТАП: <span id="stage-counter">0</span>/7</div>
            <div>❤️ ЖИЗНИ: <span id="lives">❤️❤️❤️</span></div>
            <div>🦀 КРАБОВ: <span id="crab-count">1</span></div>
            <div>🖱️ КЛИКОВ: <span id="click-counter">0</span></div>
        </div>

        <div id="title">
            <span class="crab">🦀</span>
            <span id="title-text">ОСКОРБИТЕЛЬНЫЙ КВЕСТ</span>
            <span class="crab">🦀</span>
        </div>

        <div id="message">
            <span class="emoji-big">🤬</span>
            <span id="message-text">Нажми на кнопку, чтобы начать</span>
        </div>

        <div id="button-area">
            <button class="game-btn btn-main" id="main-btn" onclick="handleMain()">🚀 СТАРТ</button>
        </div>

        <button id="restart-btn" class="hidden" onclick="restartGame()">🔄 Играть заново</button>
        <br>
        <button class="game-btn btn-theme" onclick="showStats()" style="margin-top: 10px;">📊 Статистика</button>
    </div>

    <script>
        // ========== ИГРОВОЙ ДВИЖОК ==========
        let state = {
            stage: 0,
            lives: 3,
            crabCount: 1,
            achievements: [],
            gameOver: false,
            bossAnswered: false,
            clicks: 0,
            startTime: Date.now(),
            livesLost: 0
        };

        let audioCtx = null;

        // ЗВУКИ
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'click') {
                    osc.frequency.value = 600;
                    gain.gain.value = 0.1;
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'achievement') {
                    osc.frequency.value = 800;
                    gain.gain.value = 0.15;
                    osc.start();
                    setTimeout(() => {
                        osc.frequency.value = 1000;
                    }, 100);
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'death') {
                    osc.frequency.value = 200;
                    gain.gain.value = 0.2;
                    osc.start();
                    setTimeout(() => {
                        osc.frequency.value = 150;
                    }, 200);
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'win') {
                    osc.frequency.value = 500;
                    gain.gain.value = 0.15;
                    osc.start();
                    setTimeout(() => { osc.frequency.value = 600; }, 100);
                    setTimeout(() => { osc.frequency.value = 800; }, 200);
                    setTimeout(() => { osc.frequency.value = 1000; }, 300);
                    osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'boss') {
                    osc.frequency.value = 300;
                    gain.gain.value = 0.2;
                    osc.start();
                    setTimeout(() => {
                        osc.frequency.value = 500;
                    }, 150);
                    setTimeout(() => {
                        osc.frequency.value = 700;
                    }, 300);
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) {
                // тихо игнорим, если звук не работает
            }
        }

        const stages = [
            {
                id: 'start',
                title: '🚨 ТЫ ГОТОВ?',
                message: 'Нажми на кнопку, чтобы начать свой путь унижений!',
                emoji: '🤬',
                buttons: [{ text: '🚀 СТАРТ', class: 'btn-main', action: 'next' }]
            },
            {
                id: 'polish',
                title: '🇵🇱 ПОЛЬСКИЙ УРОВЕНЬ',
                message: '🖕 PIERDOL SIĘ! 🖕',
                emoji: '🇵🇱',
                buttons: [{ text: '🤷 I dont knowing Polish', class: 'btn-next', action: 'next' }]
            },
            {
                id: 'english',
                title: '🇬🇧 АНГЛИЙСКИЙ УРОВЕНЬ',
                message: '🖕 Fuck you to! 🖕',
                emoji: '🇬🇧',
                buttons: [{ text: '🤷 I dont knowing English', class: 'btn-next', action: 'next' }]
            },
            {
                id: 'russian',
                title: '🇷🇺 РУССКИЙ УРОВЕНЬ',
                message: '🖕 Сам иди к черту! 🖕',
                emoji: '🇷🇺',
                buttons: [{ text: '🤷 I dont knowing Russian', class: 'btn-next', action: 'next' }]
            },
            {
                id: 'boss',
                title: '👹 ФИНАЛЬНЫЙ БОСС (КАПЧА)',
                message: 'Чтобы пройти дальше, напиши "Я ЛОХ" (заглавными) и нажми Enter!',
                emoji: '👹',
                buttons: []
            },
            {
                id: 'choice',
                title: '🌍 ВЫБОР СУДЬБЫ',
                message: 'Куда перенаправляемся?<br>Dokąd przekierowujemy?<br>Where are we redirecting?',
                emoji: '🌍',
                buttons: [
                    { text: 'Google = American happiness / Polskie szczęście', class: 'btn-google', action: 'google' },
                    { text: 'Яндекс = Нищета России', class: 'btn-yandex', action: 'yandex' }
                ]
            }
        ];

        function updateUI() {
            document.getElementById('stage-counter').textContent = state.stage;
            let hearts = '';
            for (let i = 0; i < state.lives; i++) hearts += '❤️';
            if (state.lives === 0) hearts = '💀';
            document.getElementById('lives').textContent = hearts;
            document.getElementById('crab-count').textContent = state.crabCount;
            document.getElementById('click-counter').textContent = state.clicks;
        }

        function showAchievement(text) {
            const el = document.getElementById('achievement');
            el.textContent = '🏆 ' + text;
            el.classList.add('show');
            playSound('achievement');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function loseLife() {
            state.lives--;
            state.livesLost++;
            playSound('death');
            updateUI();
            if (state.lives === 0) {
                state.gameOver = true;
                document.getElementById('message-text').innerHTML = '💀 ТЫ УМЕР ОТ ОСКОРБЛЕНИЙ! 💀';
                document.getElementById('button-area').innerHTML = '';
                document.getElementById('restart-btn').classList.remove('hidden');
                document.getElementById('title-text').textContent = '☠️ GAME OVER ☠️';
                if (!state.achievements.includes('death')) {
                    state.achievements.push('death');
                    showAchievement('💀 "Смерть от оскорблений"');
                }
                return true;
            }
            return false;
        }

        function renderStage(index) {
            if (state.gameOver) return;
            if (index >= stages.length) {
                document.getElementById('message-text').innerHTML = '🎉 ТЫ ПРОШЁЛ ВСЕ ЭТАПЫ! 🎉<br>🦀 КРАБ ТОБОЙ ГОРДИТСЯ!';
                document.getElementById('button-area').innerHTML = '';
                document.getElementById('restart-btn').classList.remove('hidden');
                document.getElementById('title-text').textContent = '🏆 ПОБЕДА! 🏆';
                playSound('win');
                if (!state.achievements.includes('winner')) {
                    state.achievements.push('winner');
                    showAchievement('🏆 "Профессиональный мазохист"');
                }
                return;
            }

            const stage = stages[index];
            document.getElementById('title-text').textContent = stage.title;
            document.getElementById('message-text').innerHTML = stage.message;
            
            const area = document.getElementById('button-area');
            area.innerHTML = '';

            if (stage.id === 'boss') {
                const input = document.createElement('input');
                input.id = 'boss-input';
                input.type = 'text';
                input.placeholder = 'Введи "Я ЛОХ"';
                input.autofocus = true;
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        checkBossAnswer(this);
                    }
                });
                area.appendChild(input);
                
                const submitBtn = document.createElement('button');
                submitBtn.textContent = '✅ ПРОВЕРИТЬ';
                submitBtn.className = 'game-btn btn-boss';
                submitBtn.onclick = function() {
                    const inp = document.getElementById('boss-input');
                    checkBossAnswer(inp);
                };
                area.appendChild(submitBtn);
                return;
            }

            stage.buttons.forEach(btn => {
                const el = document.createElement('button');
                el.textContent = btn.text;
                el.className = `game-btn ${btn.class}`;
                el.onclick = function() {
                    if (state.gameOver) return;
                    state.clicks++;
                    playSound('click');
                    
                    if (btn.action === 'next') {
                        state.stage++;
                        if (Math.random() < 0.1) {
                            if (loseLife()) return;
                            showAchievement('💥 "Случайная смерть! -1 жизнь"');
                        }
                        state.crabCount++;
                        updateUI();
                        renderStage(state.stage);
                    } else if (btn.action === 'google') {
                        if (!state.achievements.includes('google')) {
                            state.achievements.push('google');
                            showAchievement('🇺🇸 "Американское счастье"');
                        }
                        state.crabCount += 2;
                        updateUI();
                        window.open('https://www.google.com', '_blank');
                    } else if (btn.action === 'yandex') {
                        if (!state.achievements.includes('yandex')) {
                            state.achievements.push('yandex');
                            showAchievement('🇷🇺 "Нищета России"');
                        }
                        state.crabCount += 2;
                        updateUI();
                        window.open('https://yandex.ru', '_blank');
                    }
                };
                area.appendChild(el);
            });
        }

        function checkBossAnswer(input) {
            if (state.gameOver) return;
            state.clicks++;
            
            if (input.value === 'Я ЛОХ') {
                state.bossAnswered = true;
                state.stage++;
                playSound('boss');
                if (!state.achievements.includes('boss')) {
                    state.achievements.push('boss');
                    showAchievement('👹 "Победитель босса"');
                }
                state.crabCount += 5;
                input.classList.remove('boss-wrong');
                input.classList.add('boss-correct');
                setTimeout(() => {
                    input.classList.remove('boss-correct');
                    updateUI();
                    renderStage(state.stage);
                }, 500);
            } else {
                if (loseLife()) return;
                showAchievement('😡 "Неправильный ответ! -1 жизнь"');
                input.classList.add('boss-wrong');
                setTimeout(() => {
                    input.classList.remove('boss-wrong');
                    input.value = '';
                    input.focus();
                }, 500);
            }
        }

        function handleMain() {
            if (state.gameOver) return;
            state.clicks++;
            playSound('click');
            state.stage = 1;
            state.crabCount = 3;
            state.startTime = Date.now();
            updateUI();
            renderStage(1);
            if (!state.achievements.includes('started')) {
                state.achievements.push('started');
                showAchievement('🚀 "Путь унижений начат"');
            }
        }

        function restartGame() {
            state.stage = 0;
            state.lives = 3;
            state.crabCount = 1;
            state.gameOver = false;
            state.achievements = [];
            state.bossAnswered = false;
            state.clicks = 0;
            state.livesLost = 0;
            state.startTime = Date.now();
            document.getElementById('restart-btn').classList.add('hidden');
            document.getElementById('button-area').innerHTML = '';
            updateUI();
            document.getElementById('title-text').textContent = 'ОСКОРБИТЕЛЬНЫЙ КВЕСТ';
            document.getElementById('message-text').innerHTML = 'Нажми на кнопку, чтобы начать';
            const area = document.getElementById('button-area');
            area.innerHTML = `<button class="game-btn btn-main" onclick="handleMain()">🚀 СТАРТ</button>`;
        }

        // ТЕМЫ
        function setTheme(theme) {
            document.body.className = theme;
            playSound('click');
        }

        // СТАТИСТИКА
        function showStats() {
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            document.getElementById('stat-time').textContent = elapsed;
            document.getElementById('stat-clicks').textContent = state.clicks;
            document.getElementById('stat-crabs').textContent = state.crabCount;
            document.getElementById('stat-lives').textContent = state.livesLost;
            document.getElementById('stat-achieve').textContent = state.achievements.length;
            document.getElementById('stat-overlay').classList.add('show');
            playSound('click');
        }

        function closeStats() {
            document.getElementById('stat-overlay').classList.remove('show');
            playSound('click');
        }

        // инициализация
        updateUI();
    </script>

</body>
</html>
